# Publica o site na Hostinger VPS (via Docker Compose)
# Pré-requisitos:
#   - VPS Hostinger com template Docker instalado
#   - Secret no GitHub: HOSTINGER_API_KEY (sua API key da Hostinger)
#   - Variable no GitHub: HOSTINGER_VM_ID (ex.: se o hostname é srv123456.hstgr.cloud, o ID é 123456)
#   - docker-compose.yml na raiz do repositório (já criado)
# Config: repositório -> Settings -> Secrets and variables -> Actions
name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Hostinger VPS
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: lar-do-amigo
