# Publica o site estático (pasta src/) no GitHub Pages
# Usa as actions oficiais do GitHub (upload-pages-artifact + deploy-pages),
# necessárias porque o site não está na raiz do repositório.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissões necessárias para publicar no Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que apenas um deploy por vez aconteça
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Habilita o Pages automaticamente (caso ainda não esteja ativo)
          enablement: true

      - name: Upload site artifact 
        uses: actions/upload-pages-artifact@v3
        with:
          # Pasta que será publicada (onde está o index.html)
          path: src

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
